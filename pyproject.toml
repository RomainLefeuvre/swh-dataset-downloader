[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["downloader"]

[project]
name = "swh-dataset-downloader"
version = "0.1.0"
description = "Download source trees from Software Heritage or GitHub for a list of (url, swhid) pairs."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "click>=8.1.0",
]

[project.scripts]
run_pipeline = "downloader.main:main"

[tool.uv]
dev-dependencies = []
